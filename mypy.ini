# mypy for the Python scripts: strict mode, every optional error code.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
enable_error_code = redundant-expr, truthy-bool, truthy-iterable, ignore-without-code, possibly-undefined, redundant-self, unused-awaitable, explicit-override, mutable-override, unimported-reveal, deprecated, exhaustive-match
