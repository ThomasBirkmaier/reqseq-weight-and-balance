name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REQSEQ_URL: https://github.com/ThomasBirkmaier/ReqSeq/releases/download/v0.7

jobs:
  spec:
    name: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install ReqSeq 0.7.0
        run: |
          mkdir -p "$RUNNER_TEMP/reqseq" && cd "$RUNNER_TEMP/reqseq"
          curl -fsSLO "$REQSEQ_URL/reqseq-cli-0.7.0.tgz"
          curl -fsSLO "$REQSEQ_URL/SHA256SUMS.txt"
          sha256sum -c --ignore-missing SHA256SUMS.txt
          npm install -g --offline ./reqseq-cli-0.7.0.tgz
          reqseq --version
      - name: Check the ReqSeq workspace
        run: reqseq workspace check --workspace spec

  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install ReqSeq 0.7.0
        run: |
          mkdir -p "$RUNNER_TEMP/reqseq" && cd "$RUNNER_TEMP/reqseq"
          curl -fsSLO "$REQSEQ_URL/reqseq-cli-0.7.0.tgz"
          curl -fsSLO "$REQSEQ_URL/SHA256SUMS.txt"
          sha256sum -c --ignore-missing SHA256SUMS.txt
          npm install -g --offline ./reqseq-cli-0.7.0.tgz
      - name: Unit and acceptance tests (JUnit)
        working-directory: core
        run: cargo nextest run --profile ci
      - name: Build WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path core/Cargo.toml
      - name: Map Rust test names and enrich JUnit with ReqSeq
        if: always()
        run: |
          mkdir -p evidence-out
          python3 scripts/junit-map.py core/target/nextest/ci/junit.xml evidence-out/core-junit.xml
          reqseq evidence enrich-junit evidence-out/core-junit.xml "${GITHUB_SHA::7}" --workspace spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-junit
          path: evidence-out/

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install ReqSeq 0.7.0
        run: |
          mkdir -p "$RUNNER_TEMP/reqseq" && cd "$RUNNER_TEMP/reqseq"
          curl -fsSLO "$REQSEQ_URL/reqseq-cli-0.7.0.tgz"
          curl -fsSLO "$REQSEQ_URL/SHA256SUMS.txt"
          sha256sum -c --ignore-missing SHA256SUMS.txt
          npm install -g --offline ./reqseq-cli-0.7.0.tgz
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the web app
        run: sh scripts/build.sh
      - name: End-to-end tests (JUnit and screenshots)
        run: npx playwright test
        env:
          CI: "true"
      - name: Enrich JUnit with ReqSeq
        if: always()
        run: |
          mkdir -p evidence-out
          cp test-results/e2e-junit.xml evidence-out/e2e-junit.xml
          reqseq evidence enrich-junit evidence-out/e2e-junit.xml "${GITHUB_SHA::7}" --workspace spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-results
          path: |
            evidence-out/
            test-results/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [spec, core, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
